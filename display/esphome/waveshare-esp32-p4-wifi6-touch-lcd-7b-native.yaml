# Power Flow Card drawn natively on a Waveshare ESP32-P4-WIFI6-Touch-LCD-7B
# (1024x600 MIPI-DSI, GT911 touch, Wi-Fi on an ESP32-C6 over SDIO).
#
# Instead of a picture of the card (waveshare-esp32-p4-wifi6-touch-lcd-7b.yaml),
# the display fetches the card's Now view as data from the renderer
# (/model.json, the card's own snapshot()) and draws it with LVGL - the
# figures and texts are the card's, the screen reacts at once and the flow
# dots move smoothly. The component is in components/energy_ui.
substitutions:
  name: energy-display-p4
  friendly_name: Energy display P4
  renderer_url: http://192.168.2.160:8099
  sleep_after_min: "10"  # backlight off after this many minutes untouched, at night
  night_from: "22"       # night = from this hour ...
  night_to: "6"          # ... to this hour

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0

external_components:
  - source:
      type: git
      url: https://github.com/MarkusHogsved/power-flow-card-now-flow-forecast
      ref: main
      path: display/esphome/components
    components: [energy_ui]
    refresh: 1h

esp32:
  variant: ESP32P4
  flash_size: 32MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

psram:
  speed: 200MHz

# Power for the MIPI-DSI PHY
esp_ldo:
  - channel: 3
    voltage: 2.5V

logger:
  hardware_uart: UART0

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

time:
  - platform: homeassistant
    id: ha_time

# ---------------------------------------------------------------- Hardware

i2c:
  sda: GPIO7
  scl: GPIO8
  frequency: 400kHz
  id: bus_a

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO32
    inverted: true
    frequency: 20kHz

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

switch:
  - platform: restart
    name: Restart

display:
  - platform: mipi_dsi
    id: panel
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  platform: gt911
  id: touch
  i2c_id: bus_a
  display: panel
  # The GT911 reports coordinates rotated 180 degrees from the panel
  transform:
    mirror_x: true
    mirror_y: true
  on_touch:
    - lambda: id(last_touch_ms) = millis();
    - light.turn_on: backlight

globals:
  - id: last_touch_ms
    type: uint32_t

# ---------------------------------------------------------------- Interface

lvgl:
  displays: panel
  touchscreens: touch
  buffer_size: 100%
  bg_color: 0x000000
  # energy_ui draws on this page (without one LVGL shows a hello-world page)
  pages:
    - id: energy_page

font:
  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Core]
    glyphs: "·–~…"
    extras: &arrows
      - file: "gfonts://Noto Sans Math"
        glyphs: "←↑→↓"
  - file: "gfonts://Roboto"
    id: roboto_20
    size: 20
    bpp: 4
    glyphsets: [GF_Latin_Core]
    glyphs: "·–~…"
    extras: *arrows
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: roboto_20_bold
    size: 20
    bpp: 4
    glyphsets: [GF_Latin_Core]
    glyphs: "·–~…"
    extras: *arrows
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: roboto_30_bold
    size: 30
    bpp: 4
    glyphsets: [GF_Latin_Core]
    glyphs: "·–~…"
    extras: *arrows
  - file: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: mdi_32
    size: 32
    bpp: 4
    glyphs:
      - "\U000F1A73"  # solar-power-variant
      - "\U000F0D3E"  # transmission-tower
      - "\U000F02DC"  # home
      - "\U000F0B6C"  # car-electric
      - "\U000F1A43"  # heat-pump
      - "\U000F0F92"  # water-boiler
      - "\U000F0606"  # pool
      - "\U000F0241"  # flash

energy_ui:
  url: ${renderer_url}/model.json
  poll_interval: 3s
  font_small: roboto_16
  font_medium: roboto_20
  font_bold: roboto_20_bold
  font_large: roboto_30_bold
  font_icons: mdi_32

interval:
  # Backlight off at night after a while untouched; a touch turns it on again
  - interval: 30s
    then:
      - if:
          condition:
            lambda: |-
              auto now = id(ha_time).now();
              if (!now.is_valid()) return false;
              int from = ${night_from}, to = ${night_to};
              bool night = from > to ? (now.hour >= from || now.hour < to) : (now.hour >= from && now.hour < to);
              return night && millis() - id(last_touch_ms) > ${sleep_after_min} * 60000UL;
          then:
            - light.turn_off: backlight
