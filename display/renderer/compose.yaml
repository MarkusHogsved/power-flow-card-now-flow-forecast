# Renderer for small displays. Runs next to Home Assistant on the local
# network; the display fetches http://<this host>:8099/frame.jpg.
services:
  card-renderer:
    image: ghcr.io/puppeteer/puppeteer:24.10.0
    container_name: card-renderer
    network_mode: host
    restart: unless-stopped
    environment:
      HA_URL: http://localhost:8123        # Home Assistant, as seen from this host
      HA_TOKEN: ""                          # long-lived access token (HA profile -> Security)
      DASHBOARD: dashboard-greenhouse       # url_path of the dashboard with the card
      CARD_INDEX: "0"                       # first card of this type on that dashboard
      WIDTH: "800"
      HEIGHT: "480"
      ROTATE: "90"                          # 90 or 270 depending on how the panel hangs, 0 = landscape card
      IDLE_RESET_S: "120"                   # back to the default view after 2 min untouched
      PORT: "8099"
    # Fetches the renderer from the repository at start, so a restart updates it
    command:
      - sh
      - -c
      - >-
        node -e "fetch('https://raw.githubusercontent.com/MarkusHogsved/power-flow-card-now-flow-forecast/main/display/renderer/server.mjs')
        .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(t => require('fs').writeFileSync('/home/pptruser/server.mjs', t))"
        && exec node /home/pptruser/server.mjs
