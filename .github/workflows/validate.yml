name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"  # weekly, catches new HACS checks breaking us

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: power-flow-card-now-flow-forecast
          path: dist/power-flow-card-now-flow-forecast.js

  # HACS reads the card from the latest release asset, which only exists
  # once Release has run on main - so validate main, not PR branches.
  hacs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
