name: Release

# Builds the card and creates a tag + GitHub release (with the .js as the
# asset HACS installs) whenever the version in package.json is bumped on
# main. Release notes come from CHANGELOG.md (the section for that version).
# Bump the version, add a changelog section, merge - done.

on:
  push:
    branches: [main]
    paths:
      - package.json
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: "22"
          cache: npm

      - name: Test and build
        if: steps.version.outputs.exists == 'false'
        run: |
          npm ci
          npm test
          npm run build

      - name: Extract release notes
        if: steps.version.outputs.exists == 'false'
        run: |
          python3 - "${{ steps.version.outputs.version }}" > notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[?{re.escape(version)}\]?.*?$(.*?)(?=^## |\Z)", text, re.S | re.M)
          print(m.group(1).strip() if m else f"Power Flow Card - Now / Flow / Forecast {version}")
          PY

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "Power Flow Card - Now / Flow / Forecast ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            dist/power-flow-card-now-flow-forecast.js
